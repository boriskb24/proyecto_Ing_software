services:
  # ============================================================
  # Servicio Principal de la Aplicación en Contenedor (Producción)
  # Ejecutar: docker compose up --build
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: mi-proyecto-app
    ports:
      - "3000:3000"
    volumes:
      # Persistencia de la base de datos SQLite entre reinicios
      - sqlite_data:/app/tmp
    environment:
      - TZ=UTC
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - LOG_LEVEL=info
      - APP_KEY=${APP_KEY:-75XWfpmYtAYMH3VnMklC6sB26ABlGEj5}
      - APP_URL=http://localhost:3000
      - SESSION_DRIVER=cookie
    restart: unless-stopped

  # ============================================================
  # Servicio de Desarrollo con Hot-Reload
  # Ejecutar: docker compose --profile dev up
  # ============================================================
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dependencies
    profiles:
      - dev
    container_name: mi-proyecto-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - TZ=UTC
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=development
      - LOG_LEVEL=info
      - APP_KEY=${APP_KEY:-75XWfpmYtAYMH3VnMklC6sB26ABlGEj5}
      - APP_URL=http://localhost:3000
      - SESSION_DRIVER=cookie
    command: sh -c "node ace migration:run --force && node ace db:seed && node ace serve --hmr"

volumes:
  sqlite_data:
    driver: local
