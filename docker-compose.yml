services:
  # ============================================================
  # 1. Base de Datos: MySQL 8.4
  # ============================================================
  db:
    image: docker.io/library/mysql:8.4
    container_name: ubb-dochub-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password123}
      MYSQL_DATABASE: ${DB_NAME:-ubb_doc_hub}
      MYSQL_ROOT_HOST: "%"
    # ports:
      # En producción solo escucha en localhost (no expuesto a la red pública por seguridad)
      # - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dochub-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # 2. Backend: Spring Boot 3 REST API (Java 17)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ubb-dochub-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-ubb_doc_hub}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password123}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8009,http://localhost:5173,http://localhost:80,http://localhost}
      - AI_LLM_BASE_URL=${AI_LLM_BASE_URL:-https://api.groq.com/openai/v1}
      - AI_LLM_API_KEY=${AI_LLM_API_KEY:-}
      - AI_LLM_MODEL=${AI_LLM_MODEL:-openai/gpt-oss-20b}
      - AI_LLM_TIMEOUT_SECONDS=${AI_LLM_TIMEOUT_SECONDS:-60}
    # ports:
      # Solo accesible localmente; el tráfico público pasa por el Reverse Proxy Nginx del Frontend
      # - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - dochub-network

  # ============================================================
  # 3. Frontend: React 19 SPA + Vite + Nginx Reverse Proxy
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ubb-dochub-frontend
    restart: always
    depends_on:
      - backend
    ports:
      # ÚNICO puerto que necesita ser solicitado y abierto en el firewall del servidor
      - "${APP_PORT:-8009}:80"
    networks:
      - dochub-network

  # ============================================================
  # 4. Administrador Web de Base de Datos: phpMyAdmin
  # ============================================================
  # phpmyadmin:
    # image: docker.io/library/phpmyadmin:latest
    # container_name: ubb-dochub-phpmyadmin
    # restart: always
    # depends_on:
      # db:
        # condition: service_healthy
    # environment:
      # PMA_HOST: db
      # PMA_PORT: 3306
      # PMA_USER: ${DB_USER:-root}
      # PMA_PASSWORD: ${DB_PASSWORD:-password123}
    # ports:
      # Solo accesible localmente o mediante túnel SSH (ssh -L 8081:localhost:8081 servidor)
      # - "127.0.0.1:${PHPMYADMIN_HOST_PORT:-8081}:80"
    # networks:
      # - dochub-network

networks:
  dochub-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local
