services:
  # ============================================================
  # 1. Base de Datos: MySQL 8.0
  # ============================================================
  db:
    image: mysql:8.0
    container_name: ubb-dochub-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: ubb_doc_hub
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dochub-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # 2. Backend: Spring Boot 3 REST API (Java 17)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ubb-dochub-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=ubb_doc_hub
      - DB_USER=root
      - DB_PASSWORD=password123
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:80,http://localhost
    ports:
      - "8080:8080"
    networks:
      - dochub-network

  # ============================================================
  # 3. Frontend: React 18/19 SPA + Vite + Nginx
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ubb-dochub-frontend
    restart: always
    depends_on:
      - backend
    ports:
      # - "80:80"
      - "5173:80"
    networks:
      - dochub-network

networks:
  dochub-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
