services:
  # ============================================================
  # Development service
  # Run: docker compose --profile dev up
  # ============================================================
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dependencies # Only install deps, don't build
    profiles:
      - dev
    container_name: mi-proyecto-dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot-reload
      - .:/app
      # Avoid overwriting container's node_modules with host's
      - /app/node_modules
    environment:
      - TZ=UTC
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=development
      - LOG_LEVEL=info
      - APP_KEY=${APP_KEY:-75XWfpmYtAYMH3VnMklC6sB26ABlGEj5}
      - APP_URL=http://localhost:3000
      - SESSION_DRIVER=cookie
    command: node ace serve --hmr

  # ============================================================
  # Production service
  # Run: docker compose --profile prod up --build
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    profiles:
      - prod
    container_name: mi-proyecto-prod
    ports:
      - "3000:3000"
    volumes:
      # Persist SQLite database across container restarts
      - sqlite_data:/app/tmp
    environment:
      - TZ=UTC
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - LOG_LEVEL=info
      - APP_KEY=${APP_KEY:-75XWfpmYtAYMH3VnMklC6sB26ABlGEj5}
      - APP_URL=http://localhost:3333
      - SESSION_DRIVER=cookie
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
