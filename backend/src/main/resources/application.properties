# Server Configuration
server.port=8080

# Application Name
spring.application.name=ubb-doc-hub

# Database Configuration (Docker network 'db:3306' with environment variable overrides)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:ubb_doc_hub}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost

# Multipart Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Configuración del ChatBot RetroPlaniMate
# OpenAI-compatible: Ollama local / Groq cloud
# Para Ollama local: http://localhost:11434/v1 (sin api-key)
# Para Gro1 cloud: https://api.groq.com/openai/v1 (con AI_LLM_API_KEY)

ai.llm.base-url=${AI_LLM_BASE_URL:https://api.groq.com/openai/v1}
ai.llm.api-key=${AI_LLM_API_KEY:}
ai.llm.model=${AI_LLM_MODEL:qwen/qwen3.8-27b}
ai.llm.timeout-seconds=${AI_LLM_TIMEOUT_SECONDS:60}

# Control de concurrencia y protección de hardware (Semáforo)
ai.llm.max-concurrency=${AI_LLM_MAX_CONCURRENCY:2}
ai.llm.queue-timeout-seconds=${AI_LLM_QUEUE_TIMEOUT_SECONDS:30}
