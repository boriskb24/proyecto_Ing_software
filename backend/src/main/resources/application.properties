# Server Configuration
server.port=8080

# Application Name
spring.application.name=ubb-doc-hub

# Database Configuration (Docker network 'db:3306' with environment variable overrides)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:ubb_doc_hub}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost

